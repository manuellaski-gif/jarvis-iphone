<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b13"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JARVIS"><title>JARVIS | Personal Assistant</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 27%,#27111f,#080b13 60%);color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh}.wrap{max-width:560px;margin:auto;padding:30px 20px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:4px;font-size:25px}.sub{font-size:10px;letter-spacing:2px;color:#a0a4b4}.status{color:#70e7ae;font-size:12px}.orbspace{height:300px;display:grid;place-items:center}.orb{width:190px;height:190px;border-radius:50%;border:2px solid #fa405e;box-shadow:0 0 12px #fa405e,0 0 45px #b5093b66,inset 0 0 40px #e3214b77;display:grid;place-items:center;position:relative;animation:pulse 3s ease-in-out infinite}.orb:before,.orb:after{content:'';position:absolute;border-radius:50%;border:1px dashed #fb6b87}.orb:before{inset:-19px}.orb:after{inset:19px;border-style:solid}.core{width:85px;height:85px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffc1c9,#f13259 35%,#a50737 90%);box-shadow:0 0 40px #ff325a}@keyframes pulse{50%{box-shadow:0 0 24px #fa405e,0 0 70px #b5093b99,inset 0 0 55px #e3214b88}}h1{text-align:center;font-size:19px;margin:0 0 8px}.hint{text-align:center;color:#a7a9b8;font-size:13px;margin:0 0 28px}.chat{min-height:94px;background:#131723;border:1px solid #2e3142;border-radius:16px;padding:15px;font-size:14px;line-height:1.5;margin-bottom:16px}.chat .who{color:#ff718c;font-weight:700;font-size:11px;letter-spacing:1px;margin-bottom:7px}.controls{display:flex;gap:10px}.controls input{flex:1;min-width:0;background:#161a27;border:1px solid #343747;border-radius:12px;color:white;padding:14px;font-size:15px}.controls button,.actions button{border:0;border-radius:12px;background:#df3153;color:white;padding:14px;font-weight:700;cursor:pointer}.controls .mic{font-size:20px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.actions button{background:#191d2b;text-align:left;border:1px solid #353344;font-size:13px}.actions span{display:block;font-size:20px;margin-bottom:6px}.foot{color:#7c8295;font-size:11px;text-align:center;margin-top:26px}button:active{transform:scale(.98)}</style></head>
<body><main class="wrap"><div class="top"><div><div class="brand">J.A.R.V.I.S.</div><div class="sub">PERSONAL ASSISTANT · V1.1</div></div><div class="status">● ONLINE</div></div><div class="orbspace"><div class="orb"><div class="core"></div></div></div><h1 id="headline">Bereit für deine Befehle</h1><p class="hint">Tippe einen Befehl ein oder nutze das Mikrofon.</p><div class="chat" aria-live="polite"><div class="who">JARVIS</div><div id="reply">Willkommen, Boss. Sag „Hilfe“, um meine Funktionen zu entdecken.</div></div><form class="controls" id="form"><input id="command" placeholder="Was soll ich tun, Boss?" aria-label="Befehl" autocomplete="off"><button type="submit">➤</button><button type="button" class="mic" id="mic" aria-label="Sprachbefehl">🎙</button></form><div class="actions"><button data-cmd="Wie spät ist es?"><span>🕒</span>Uhrzeit</button><button data-cmd="Öffne Kalender"><span>📅</span>Kalender</button><button data-cmd="Öffne Google"><span>🌐</span>Websuche</button><button data-cmd="Business Idee"><span>💼</span>Business-Idee</button></div><div class="foot">Kostenloser Prototyp · Keine KI-API · Sprachfunktionen browserabhängig</div></main>
<script>
const input=document.querySelector('#command'),reply=document.querySelector('#reply'),headline=document.querySelector('#headline');
function jarvisVoice(){const v=speechSynthesis.getVoices(),de=v.filter(x=>/^de[-_]/i.test(x.lang));return de.find(x=>/anna|petra|helena|katja|female|frau/i.test(x.name))||de.find(x=>/premium|enhanced/i.test(x.name))||de[0]||null}
function speak(t){try{if(!('speechSynthesis' in window))return;const synth=window.speechSynthesis;synth.cancel();const u=new SpeechSynthesisUtterance(t),v=jarvisVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang='de-DE';u.rate=.94;u.pitch=1.12;u.volume=1;synth.speak(u)}catch(e){console.warn('JARVIS voice unavailable',e)}}
function answer(cmd){let q=cmd.toLowerCase().trim(),msg='Diesen Befehl kenne ich noch nicht. Sag Hilfe, um meine Funktionen zu sehen.',url=null;if(/hallo|guten morgen|hey jarvis|hi jarvis/.test(q))msg='Hallo Boss. Ich bin bereit. Was kann ich für dich tun?';else if(/hilfe|was kannst/.test(q))msg='Ich kann dir die Uhrzeit und das Datum nennen, eine Websuche öffnen, deinen Kalender öffnen und dir eine Geschäftsidee vorschlagen.';else if(/uhr|zeit/.test(q))msg='Es ist '+new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})+' Uhr.';else if(/datum|welcher tag|heute/.test(q))msg='Heute ist '+new Date().toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';else if(/kalender/.test(q)){msg='Ich öffne den Kalender im Browser. Für den iPhone-Kalender benötigen wir später einen Kurzbefehl.';url='https://calendar.google.com/'}else if(/google|suche|website|web/.test(q)){msg='Ich öffne die Websuche.';url='https://www.google.com/'}else if(/business|geschäft|shop|verkauf|unternehmen/.test(q))msg='Business-Idee: Starte mit einer kleinen Nische, zum Beispiel Zubehör für Elektroinstallateure. Prüfe Nachfrage, Einkaufskosten, Versand und Marge, bevor du Geld investierst.';reply.textContent=msg;headline.textContent='Befehl verarbeitet';speak(msg);if(url)window.open(url,'_blank','noopener,noreferrer')}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();if(input.value.trim()){answer(input.value);input.value=''}});document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>answer(b.dataset.cmd));document.querySelector('#mic').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){reply.textContent='Spracherkennung wird in diesem Browser nicht unterstützt. Bitte tippe deinen Befehl ein oder verwende später einen iPhone-Kurzbefehl.';return}let r=new R();r.lang='de-DE';r.interimResults=false;headline.textContent='Ich höre zu …';r.onresult=e=>{let t=e.results[0][0].transcript;input.value=t;answer(t)};r.onerror=e=>{headline.textContent='Mikrofon nicht verfügbar';reply.textContent='Spracherkennung fehlgeschlagen ('+e.error+'). Bitte Mikrofonberechtigung prüfen oder einen Befehl eintippen.'};r.start()};
</script></body></html>
